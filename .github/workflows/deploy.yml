name: Deploy to cPanel

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: 22
          script: |
            export PATH=/home/batlamed/nodevenv/batla-medicos/24/bin:$PATH
            cd /home/batlamed/batla-medicos
            git fetch origin master
            git reset --hard origin/master
            cd backend && npm install --production
            mkdir -p /home/batlamed/batla-medicos/tmp
            touch /home/batlamed/batla-medicos/tmp/restart.txt
            echo "Deploy complete at $(date)"
